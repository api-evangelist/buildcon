name: Buildcon
description: Buildcon is a Belgrade-based construction and logistics digitalisation
  company that builds Buildx, a proprietary construction project management platform
  covering project scheduling, cost tracking, daily logs, installed-quantities
  tracking, and reporting, alongside Buildx Warehouse for warehouse management and
  Buildx Tracking for real-time asset tracking. The team pairs deep construction and
  logistics domain knowledge with a modern web stack (React, Angular, Node.js,
  PostgreSQL on AWS/DigitalOcean) to help builders and logistics operators move off
  spreadsheets and onto connected operational software. Buildcon is a portfolio
  company backed by 500 Global. As of this profile the company exposes no public
  developer API, SDK, or API documentation surface.
